name: Vim configuration smoke check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux configuration and C execution
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-nox clang
          python3 config/maintenance/portable-setup.py deploy --apply --vim /usr/bin/vim
          python3 config/maintenance/portable-setup.py smoke --practice --vim /usr/bin/vim
      - name: Check macOS configuration and C execution
        if: runner.os == 'macOS'
        run: |
          brew install vim
          vim_bin="$(brew --prefix vim)/bin/vim"
          python3 config/maintenance/portable-setup.py deploy --apply --vim "$vim_bin"
          python3 config/maintenance/portable-setup.py smoke --practice --vim "$vim_bin"
      - name: Check Windows deployment with official Vim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'vim.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'official-vim'
          $url = 'https://github.com/vim/vim-win32-installer/releases/download/v9.2.1332/gvim_9.2.1332_x64.zip'
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip).Hash -ine '3f51b15fb1ca97efcaeefd7e47711e31e391a48e0a3d87ab2a6d7e21cd81e955') {
            throw 'Unexpected Vim archive checksum'
          }
          Expand-Archive $zip $unpacked
          $vim = (Get-ChildItem $unpacked -Filter vim.exe -Recurse | Select-Object -First 1).FullName
          if (!$vim) { throw 'Official archive does not contain vim.exe' }
          if (!(Get-Command py -ErrorAction SilentlyContinue)) { throw 'Python launcher py is required' }
          & pwsh -NoProfile -File config/maintenance/deploy-windows.ps1 -Apply -Vim $vim
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          py -3 config/maintenance/portable-setup.py plugins --skip-ycm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          py -3 config/maintenance/portable-setup.py smoke --vim $vim
          exit $LASTEXITCODE
